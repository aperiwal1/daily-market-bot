# .github/workflows/daily-market-post.yml
#
# Unified: Google Sheet market data + TradingView heatmap → single Slack post
#
# Triggers:
#   - workflow_dispatch (PRIMARY): fired on time at 4:15 PM ET by an external
#     scheduler (cron-job.org → GitHub API), or manually from the Actions tab.
#     Tick "force" on a manual run to bypass all gates (testing / re-post).
#   - schedule (BACKUP ONLY): GitHub cron is best-effort and can run hours
#     late or be dropped. Two entries so one lands at 4:15 PM ET in both
#     EDT and EST; the gates below skip the extra one.
#
# Gates (unless forced): Mon–Fri, not an NYSE holiday, inside the ET post
# window, and not already posted today. A gate that fails skips every
# remaining step — nothing is built, deployed, or posted.

name: Daily Market Summary + Heatmap

on:
  schedule:
    - cron: "15 20 * * 1-5"   # 4:15 PM EDT (Mar–Nov) | 3:15 PM EST → skipped by window
    - cron: "15 21 * * 1-5"   # 4:15 PM EST (Nov–Mar) | 5:15 PM EDT → skipped if already posted
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass all gates (weekend / holiday / time window / already posted)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Queue instead of cancel: a backup run that starts while the on-time run is
# still going waits for it to finish, then skips via the "already posted" gate.
concurrency:
  group: daily-market-post
  cancel-in-progress: false

env:
  POST_WINDOW_START: "16:00"   # ET — earliest post (after the close)
  POST_WINDOW_END: "21:00"     # ET — latest post if the on-time trigger failed and only a late backup run arrives

jobs:
  # ────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      date_ny: ${{ steps.gate.outputs.date_ny }}
      market_text: ${{ steps.run_bot.outputs.market_text }}
      heatmap_sha: ${{ steps.heatmap_hash.outputs.sha }}
      heatmap_warning: ${{ steps.run_bot.outputs.heatmap_warning }}

    steps:
      - name: Log trigger and current time (UTC & New York)
        run: |
          echo "Trigger:      ${{ github.event_name }}"
          echo "UTC now:      $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "New York now: $(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S %Z')"

      # ── Gate: weekday + NYSE holiday + post window ──
      - name: Check weekday, NYSE holiday, and post window
        id: gate
        run: |
          python3 - <<'PY'
          import os
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo

          def nth_weekday(year, month, weekday, n):
              d = date(year, month, 1)
              while d.weekday() != weekday:
                  d += timedelta(days=1)
              return d + timedelta(days=7*(n-1))

          def last_weekday(year, month, weekday):
              if month < 12:
                  d = date(year, month+1, 1) - timedelta(days=1)
              else:
                  d = date(year, 12, 31)
              while d.weekday() != weekday:
                  d -= timedelta(days=1)
              return d

          def easter_date(year):
              a = year % 19; b = year // 100; c = year % 100
              d = b // 4; e = b % 4; f = (b + 8) // 25; g = (b - f + 1) // 3
              h = (19*a + b - d - g + 15) % 30; i = c // 4; k = c % 4
              l = (32 + 2*e + 2*i - h - k) % 7; m = (a + 11*h + 22*l) // 451
              month = (h + l - 7*m + 114) // 31; day = ((h + l - 7*m + 114) % 31) + 1
              return date(year, month, day)

          def observed(dt):
              if dt.weekday() == 5: return dt - timedelta(days=1)
              if dt.weekday() == 6: return dt + timedelta(days=1)
              return dt

          def to_minutes(hhmm):
              h, m = hhmm.split(":")
              return int(h) * 60 + int(m)

          now = datetime.now(ZoneInfo("America/New_York"))
          today = now.date()
          y = today.year
          hol = {
              observed(date(y,1,1)), nth_weekday(y,1,0,3), nth_weekday(y,2,0,3),
              easter_date(y) - timedelta(days=2), last_weekday(y,5,0),
              observed(date(y,6,19)), observed(date(y,7,4)), nth_weekday(y,9,0,1),
              nth_weekday(y,11,3,4), observed(date(y,12,25)),
          }

          start = os.environ["POST_WINDOW_START"]
          end = os.environ["POST_WINDOW_END"]
          now_min = now.hour * 60 + now.minute

          if today.weekday() >= 5:
              is_open, reason = False, "Weekend"
          elif today in hol:
              is_open, reason = False, "NYSE holiday"
          elif not (to_minutes(start) <= now_min <= to_minutes(end)):
              is_open, reason = False, f"Outside {start}-{end} ET post window"
          else:
              is_open, reason = True, "Weekday, not a holiday, inside post window"

          print(f"NY time {now:%Y-%m-%d %H:%M %Z}: {reason}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"open={'true' if is_open else 'false'}\n")
              f.write(f"date_ny={today.isoformat()}\n")
          PY

      # ── Gate: already posted today ──
      - name: Check if already posted today
        id: posted_cache
        if: steps.gate.outputs.open == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .post-cache-market
          key: market-posted-${{ steps.gate.outputs.date_ny }}
          lookup-only: true

      - name: Decide whether to post
        id: decide
        env:
          FORCE: ${{ github.event.inputs.force }}
          GATE_OPEN: ${{ steps.gate.outputs.open }}
          ALREADY_POSTED: ${{ steps.posted_cache.outputs.cache-hit }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "Forced manual run — bypassing all gates."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$GATE_OPEN" != "true" ]; then
            echo "Gate closed — skipping (see previous step for reason)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "$ALREADY_POSTED" = "true" ]; then
            echo "Already posted for ${{ steps.gate.outputs.date_ny }} — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "All gates passed — posting."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Everything below runs only if proceed == true ──
      - name: Checkout repository
        if: steps.decide.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.decide.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.decide.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Run daily market bot
        id: run_bot
        if: steps.decide.outputs.proceed == 'true'
        run: python daily_market_post.py

      # Fingerprint of this run's image, so the Slack job can confirm Pages
      # is serving the NEW image (not an earlier one at the same URL)
      - name: Fingerprint heatmap image
        id: heatmap_hash
        if: steps.decide.outputs.proceed == 'true'
        run: |
          SHA=$(sha256sum "site/sp500_heatmap_${{ steps.gate.outputs.date_ny }}.png" | cut -c1-64)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Heatmap sha256: ${SHA}"

      # ── Preserve previous heatmaps so old Slack links don't break ──
      - name: Restore previous heatmaps from GitHub Pages
        if: steps.decide.outputs.proceed == 'true'
        continue-on-error: true
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          BASE="https://${OWNER}.github.io/${REPO}"

          echo "Restoring previous heatmaps from GitHub Pages..."
          for i in $(seq 1 90); do
            DATE=$(date -u -d "$i days ago" +%Y-%m-%d 2>/dev/null || date -u -v-${i}d +%Y-%m-%d 2>/dev/null)
            FILE="sp500_heatmap_${DATE}.png"
            URL="${BASE}/${FILE}"
            if [ ! -f "site/${FILE}" ]; then
              HTTP_CODE=$(curl -s -o "site/${FILE}" -w "%{http_code}" "$URL")
              if [ "$HTTP_CODE" != "200" ]; then
                rm -f "site/${FILE}"
              else
                echo "  Restored: ${FILE}"
              fi
            fi
          done
          echo "Done."

      - name: Upload Pages artifact
        if: steps.decide.outputs.proceed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  # ────────────────────────────────────────────────────────────────────
  deploy:
    needs: build
    if: needs.build.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  # ────────────────────────────────────────────────────────────────────
  notify-slack:
    needs: [build, deploy]
    if: needs.build.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      DATE_NY: ${{ needs.build.outputs.date_ny }}
      HEATMAP_SHA: ${{ needs.build.outputs.heatmap_sha }}
      HEATMAP_WARNING: ${{ needs.build.outputs.heatmap_warning }}
    steps:
      - name: Build URLs
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          echo "BASE_URL=https://${OWNER}.github.io/${REPO}" >> $GITHUB_ENV

      # Wait until Pages serves THIS run's image (matching fingerprint). An
      # earlier image at the same URL returns 200 too, so status alone isn't enough.
      - name: Wait for this run's image on Pages (max ~5 min)
        run: |
          URL="${BASE_URL}/sp500_heatmap_${DATE_NY}.png"
          echo "Waiting for $URL with sha256 ${HEATMAP_SHA}"
          for i in {1..60}; do
            curl -s -o heatmap_check.png "${URL}?check=${i}-$(date +%s)" || true
            GOT=$(sha256sum heatmap_check.png 2>/dev/null | cut -c1-64)
            if [ "$GOT" = "$HEATMAP_SHA" ]; then
              echo "OK — new image is live on Pages"
              exit 0
            fi
            sleep 5
          done
          echo "::error::New heatmap never appeared on Pages — not posting"
          exit 1

      - name: Post combined message to Slack
        env:
          MARKET_TEXT: ${{ needs.build.outputs.market_text }}
        run: |
          # ?v= makes the link unique per image, so Slack never reuses a
          # cached copy of an earlier image posted at the same URL
          HEAT_URL="${BASE_URL}/sp500_heatmap_${DATE_NY}.png?v=${HEATMAP_SHA:0:12}"

          # HEATMAP_WARNING is set when TradingView's data was incomplete:
          # shown under the title with a yellow bar instead of green
          jq -n \
            --arg text "$MARKET_TEXT" \
            --arg img "$HEAT_URL" \
            --arg date "$DATE_NY" \
            --arg warn "$HEATMAP_WARNING" \
            '{
              text: $text,
              attachments: [
                {
                  fallback: ("S&P 500 Heatmap – " + $date),
                  title: ":world_map: S&P 500 Heatmap",
                  text: (if $warn == "" then "" else (":warning: " + $warn) end),
                  image_url: $img,
                  color: (if $warn == "" then "#2eb886" else "#daa038" end)
                }
              ]
            }' > payload.json

          echo "--- Payload ---"
          cat payload.json
          echo "----------------"

          # --fail-with-body: a Slack error fails this step, so the run is NOT
          # marked as posted and the backup run can retry.
          curl -sS --fail-with-body --max-time 20 -X POST \
            -H 'Content-type: application/json' \
            --data @payload.json \
            "${SLACK_WEBHOOK}"

      # ── Mark posted only after Slack succeeds ──
      - name: Mark posted today
        run: |
          mkdir -p .post-cache-market
          echo "posted $(date -u)" > .post-cache-market/posted.txt

      - name: Save posted cache
        continue-on-error: true   # key already exists on a forced re-post — harmless
        uses: actions/cache/save@v4
        with:
          path: .post-cache-market
          key: market-posted-${{ env.DATE_NY }}
